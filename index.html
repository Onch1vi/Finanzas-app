<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Finanzas</title>

<!-- Content Security Policy. Vite produces a hashed bundle (no inline eval),
     so we no longer need 'unsafe-eval'. Inline styles remain because we use
     them heavily for layout via React style props. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- iOS PWA meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0E1A">
<meta name="format-detection" content="telephone=no">

<!-- App icon (inline SVG converted) -->
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMEEwRTFBIi8+PHRleHQgeD0iOTAiIHk9IjEwOCIgZm9udC1mYW1pbHk9InNlcmlmIiBmb250LXNpemU9IjcwIiBmb250LXdlaWdodD0iNjAwIiBmaWxsPSIjMzREMzk5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj4kPC90ZXh0Pjwvc3ZnPg==">

<!-- PWA manifest -->
<link rel="manifest" href="/manifest.webmanifest">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root">
  <!-- Initial loader; React replaces this once the bundle loads -->
  <div style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#07090F; color:#A0ADCC; font-family: system-ui, sans-serif;">
    <div style="text-align:center;">
      <div style="width:42px; height:42px; margin:0 auto 16px; border-radius:50%; background:rgba(52,211,153,0.15); animation: pulse 1.4s ease-in-out infinite;"></div>
      <p style="font-size:13px; letter-spacing:0.02em;">Cargando…</p>
    </div>
  </div>
</div>
<style>
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.94); } }
  html, body { margin: 0; padding: 0; background: #07090F; }
</style>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
